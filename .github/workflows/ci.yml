name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: controlplane
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Setup venv
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -r requirements.txt || uv pip install --python .venv/Scripts/python.exe -r requirements.txt
      - name: Run tests
        run: |
          .venv/bin/python -m pytest tests/ -q || .venv/Scripts/python.exe -m pytest tests/ -q
      - name: Offline E2E
        run: |
          .venv/bin/python scripts/offline_e2e.py || .venv/Scripts/python.exe scripts/offline_e2e.py
