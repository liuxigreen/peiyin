name: CI

on:
  push:
    branches: [main, upgrade/seam-wave1]
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: controlplane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install ffmpeg and ffprobe
        shell: pwsh
        run: |
          if ($IsLinux) { sudo apt-get update; sudo apt-get install -y ffmpeg }
          elseif ($IsMacOS) { brew install ffmpeg }
          elseif ($IsWindows) { choco install ffmpeg --yes --no-progress }
          else { throw "Unsupported runner OS" }
          ffmpeg -version
          ffprobe -version
      - name: Run controlplane and node tests
        env:
          PYTHONPATH: ../gpunode
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -p no:cacheprovider tests ../gpunode/tests -q
      - name: Offline end-to-end smoke
        env:
          NODE_MODE: offline
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/offline_e2e.py
      - name: Validate release candidate archive
        working-directory: .
        run: python scripts/release_smoke.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked frontend dependencies and build outside tracked dist
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build --outDir "$RUNNER_TEMP/frontend-dist"
