services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    environment:
      DUBBING_BASIC_PASSWORD_HASH: ${DUBBING_BASIC_PASSWORD_HASH:?set a Caddy password hash}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      controlplane:
        condition: service_healthy

  controlplane:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.control
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////srv/data/dev.db
      MODE_B_STORAGE: /srv/data/mode-b
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set an encryption key}
      NODE_SHARED_SECRET: ${NODE_SHARED_SECRET:?set a node join secret}
      NODE_ARTIFACT_MAX_MB: ${NODE_ARTIFACT_MAX_MB:-256}
    volumes:
      - ./data:/srv/data
    ports:
      - "127.0.0.1:8500:8500"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8500/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  caddy-data:
  caddy-config:
